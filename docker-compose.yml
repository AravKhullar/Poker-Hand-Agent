services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: poker
      POSTGRES_PASSWORD: poker
      POSTGRES_DB: pokeragent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poker -d pokeragent"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: